<div class="breadcrumb">
      <a routerLink="/matters">Matters</a><span class="sep">›</span><span class="current">{{ isEdit ? 'Edit Matter' : 'New Matter' }}</span>
    </div>

    <div class="page-header">
      <h1 class="page-title">{{ isEdit ? 'Edit Matter' : 'New Matter' }}</h1>
      <div class="actions">
        <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" type="button" [disabled]="busy || loadingMatter" (click)="save()">{{ loadingMatter ? 'Loading…' : busy ? 'Saving…' : isEdit ? 'Save Changes' : 'Save' }}</button>
      </div>
    </div>

    @if (loadingMatter) { <div class="card loading-matter">Loading matter details…</div> }

    @if (!loadingMatter && (!isEdit || !error)) {
    <div class="columns">
      <!-- Matter Information -->
      <div class="card form-card">
        <h3 class="card-title">Matter Information</h3>

        <div class="field">
          <label for="ref">Reference</label>
          <input id="ref" class="input" type="text" placeholder="Auto-allocated if left blank (e.g. SMIT001)" [(ngModel)]="reference" />
        </div>
        <div class="field">
          <label for="title">Title <span class="req">*</span></label>
          <input id="title" class="input" type="text" [(ngModel)]="title" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="area">Practice Area <span class="req">*</span></label>
            <select id="area" class="select" [(ngModel)]="practiceArea">
              @for (a of practiceAreas; track a) { <option [value]="a">{{ a }}</option> }
            </select>
          </div>
          <div class="field">
            <label for="status">Status <span class="req">*</span></label>
            <select id="status" class="select" [(ngModel)]="status">
              <option value="Active">Active</option>
              <option value="OnHold">On Hold</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="earner">Fee Earner <span class="req">*</span></label>
            <select id="earner" class="select" [(ngModel)]="feeEarnerId">
              @for (u of users; track u.id) { <option [value]="u.id">{{ u.fullName }}</option> }
            </select>
          </div>
          <div class="field">
            <label for="opened">Open Date <span class="req">*</span></label>
            <input id="opened" class="input" type="date" [(ngModel)]="openDate" />
          </div>
        </div>

        <div class="field">
          <label for="desc">Description</label>
          <textarea id="desc" class="textarea" [(ngModel)]="description"></textarea>
        </div>
      </div>

      <!-- Client and Parties -->
      <div class="card form-card parties-card">
        <h3 class="card-title">Client and Parties</h3>

        <div class="field">
          <label for="client">Client <span class="req">*</span></label>
          <select id="client" class="select" [(ngModel)]="clientId">
            <option value="" disabled>Select a client…</option>
            @for (c of clients; track c.id) { <option [value]="c.id">{{ c.fullName }}</option> }
          </select>
        </div>

        <button class="btn btn-secondary add-party" type="button">
          <app-icon name="plus" [size]="14" /> Add Party
        </button>

        <div class="empty-parties muted">No parties added yet</div>
      </div>
    </div>
    }
    @if (error) {
      <div class="error-msg card">{{ error }}</div>
    }
