<div class="breadcrumb">
      <a routerLink="/contacts">Contacts</a><span class="sep">›</span><span class="current">New Contact</span>
    </div>

    <div class="page-header">
      <h1 class="page-title">{{ isEdit ? 'Edit Contact' : 'New Contact' }}</h1>
      <div class="actions">
        <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" type="submit" form="contact-form" [disabled]="busy || loadingContact">{{ loadingContact ? 'Loading…' : busy ? 'Saving…' : isEdit ? 'Save Changes' : 'Save' }}</button>
      </div>
    </div>

    <form id="contact-form" #contactForm="ngForm" (ngSubmit)="save(contactForm)">
    <div class="card form-card">
      <div class="columns">
        <!-- Basic Information -->
        <section>
          <h3 class="card-title">Basic Information</h3>
          <div class="field-row">
            <div class="field">
              <label for="firstName">First name <span class="req">*</span></label>
              <input id="firstName" class="input" type="text" name="firstName" [(ngModel)]="firstName" autocomplete="given-name" required />
            </div>
            <div class="field">
              <label for="surname">Surname <span class="req">*</span></label>
              <input id="surname" class="input" type="text" name="surname" [(ngModel)]="surname" autocomplete="family-name" required />
            </div>
          </div>
          <div class="field">
            <label for="type">Type <span class="req">*</span></label>
            <select id="type" class="select" name="type" [(ngModel)]="type" required>
              @for (t of contactTypes; track t) { <option [value]="t">{{ t }}</option> }
            </select>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" class="input" type="email" name="email" [(ngModel)]="email" />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" class="input" type="tel" name="phone" [(ngModel)]="phone" />
          </div>
        </section>

        <!-- Additional Information -->
        <section>
          <h3 class="card-title">Additional Information</h3>
          <div class="field">
            <label for="status">Status</label>
            <select id="status" class="select" name="status" [(ngModel)]="status">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" class="textarea" name="address" [(ngModel)]="address"></textarea>
          </div>
          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" class="textarea" name="notes" [(ngModel)]="notes"></textarea>
          </div>
        </section>
      </div>
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
    </div>
    </form>
